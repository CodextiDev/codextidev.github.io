<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPRINT-Nav Family — Sonardyne</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('sprintnav-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(err){ /* localStorage unavailable — default light applies via CSS */ }
})();
</script>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap">
<!-- Classic (non-module) three.js build: opening this file directly as
     file:// blocks ES module imports in Chrome/Firefox, so the 3D tab is
     built on the global-namespace UMD build instead. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff;
    --ink:#0d0730;
    --ink-soft:rgba(13,7,48,.86);
    --ink-faint:rgba(13,7,48,.68);
    --line:rgba(13,7,48,.12);
    --accent:#2f6f8f;
    --accent-soft:rgba(47,111,143,.10);
    --cyan:#33f3fd;
    --teal:#4ea39c;
    --purple:#713795;
    --purple-soft:rgba(113,55,149,.10);
    --stage-word-stroke:rgba(13,7,48,.08);
    --hero-shadow:rgba(13,7,48,.16);
    --tabbar-bg:rgba(255,255,255,.86);
    --depth-surface:#ffffff;
    --depth-mid:#eef6f8;
    --depth-deep:#dfeef1;
    --depth-line:rgba(47,111,143,.07);
    --ease:cubic-bezier(.16,1,.3,1);
    --ease-in:cubic-bezier(.7,0,.84,0);
  }

  /* Dark theme — same brand hues (accent teal-blue, cyan, purple), tuned for
     contrast on a near-black ground instead of remapping to different colors. */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#070c17;
    --ink:#f0f2f8;
    --ink-soft:rgba(240,242,248,.68);
    --ink-faint:rgba(240,242,248,.44);
    --line:rgba(240,242,248,.14);
    --accent:#5cb8db;
    --accent-soft:rgba(92,184,219,.16);
    --cyan:#33f3fd;
    --teal:#6bc9bd;
    --purple:#b78ad9;
    --purple-soft:rgba(183,138,217,.18);
    --stage-word-stroke:rgba(240,242,248,.09);
    --hero-shadow:rgba(0,0,0,.55);
    --tabbar-bg:rgba(7,12,23,.82);
    --depth-surface:#0a1424;
    --depth-mid:#060a14;
    --depth-deep:#02050a;
    --depth-line:rgba(92,184,219,.09);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Satoshi','Helvetica Neue',sans-serif;
    height:100vh; height:100dvh;
    position:relative;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; font-family:'Satoshi','Helvetica Neue',sans-serif; }
  ::selection{ background:var(--accent); color:#fff; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  button{ font-family:inherit; }
  img{ -webkit-user-drag:none; user-select:none; }
  p{ margin:0; }

  /* ---------- ambient background: echo-sounder depth profile ---------- */
  .backdrop{ position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg); }
  .depth-gradient{
    position:absolute; inset:0;
    background:linear-gradient(to bottom, var(--depth-surface) 0%, var(--depth-mid) 58%, var(--depth-deep) 100%);
  }
  .depth-lines{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(to bottom, var(--depth-line) 0, var(--depth-line) 1px, transparent 1px, transparent 68px);
  }
  .depth-sweep{
    position:absolute; left:0; right:0; height:140px; top:-140px;
    background:linear-gradient(to bottom, transparent 0%, var(--depth-line) 45%, transparent 100%);
    animation:depthSweep 16s linear infinite;
  }
  @keyframes depthSweep{ 0%{ transform:translateY(0); } 100%{ transform:translateY(calc(100vh + 140px)); } }
  .depth-labels{ position:absolute; inset:0; pointer-events:none; }
  .depth-labels span{
    position:absolute; left:6px; font-size:.58rem; font-weight:700; letter-spacing:.08em;
    color:var(--ink-faint); opacity:.2; font-variant-numeric:tabular-nums;
  }
  @media (prefers-reduced-motion: reduce){ .depth-sweep{ animation:none; display:none; } }

  .blob{ position:absolute; border-radius:50%; filter:blur(120px); opacity:.14; }
  .blob-cyan{ width:520px; height:520px; background:var(--cyan); top:-160px; left:-100px; animation:drift1 28s ease-in-out infinite; }
  .blob-purple{ width:560px; height:560px; background:var(--purple); bottom:-220px; right:-140px; animation:drift2 34s ease-in-out infinite; }
  .blob-teal{ width:400px; height:400px; background:var(--teal); top:40%; right:6%; opacity:.10; animation:drift1 24s ease-in-out infinite reverse; }
  @keyframes drift1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(40px,50px); } }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-40px,-40px); } }
  @media (prefers-reduced-motion: reduce){ .blob{ animation:none; } }

  [hidden]{ display:none !important; }

  /* ================= full-screen overlays (splash / language) ================= */
  .overlay{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .overlay .logo-mark{ height:54px; width:auto; margin-bottom:46px; pointer-events:none; }

  /* family hero + sonar ping (splash) */
  .splash-title{ pointer-events:none; margin-bottom:6px; }
  .splash-title h2{ font-weight:900; font-size:clamp(1.5rem,3.6vw,2.4rem); letter-spacing:-.01em; line-height:1.15; }
  .splash-title p{ margin:6px 0 0; font-weight:500; font-size:clamp(.95rem,2vw,1.25rem); color:var(--ink-soft); }
  .overlay .logo-mark{ margin-bottom:clamp(20px,4vh,46px); }
  .family-sonar{ position:relative; width:min(clamp(340px,66vw,600px), max(220px,44vh)); height:min(clamp(340px,66vw,600px), max(220px,44vh)); display:flex; align-items:center; justify-content:center; margin-bottom:14px; pointer-events:none; }
  .family-glow{
    position:absolute; inset:4%; border-radius:50%; z-index:0;
    /* soft edge comes from the gradient itself — no filter:blur, which can render as a solid
       square while the overlay crossfades */
    background:radial-gradient(closest-side, var(--cyan) 0%, var(--accent) 40%, transparent 100%);
    opacity:.3;
    animation:familyGlowPulse 2.6s ease-in-out infinite;
  }
  @keyframes familyGlowPulse{ 0%,100%{ opacity:.2; transform:scale(.94); } 50%{ opacity:.55; transform:scale(1.08); } }
  .family-ring{
    position:absolute; width:58%; height:58%; border-radius:50%; z-index:1;
    border:2px solid var(--cyan);
    box-shadow:0 0 20px 1px rgba(51,243,253,.4);
    opacity:0;
    animation:familyPing 2.8s var(--ease) infinite;
  }
  .family-ring:nth-child(2){ animation-delay:.93s; }
  .family-ring:nth-child(3){ animation-delay:1.87s; }
  @keyframes familyPing{ 0%{ transform:scale(.5); opacity:.75; } 100%{ transform:scale(2.7); opacity:0; } }
  .family-hero{
    position:relative; z-index:2; width:72%; height:72%; object-fit:contain;
    filter:drop-shadow(0 16px 32px var(--hero-shadow));
    animation:familyFloat 3.6s ease-in-out infinite;
  }
  @keyframes familyFloat{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-7px) scale(1.02); } }
  @media (prefers-reduced-motion: reduce){
    .family-glow, .family-ring, .family-hero{ animation:none; }
    .family-ring{ opacity:.2; transform:scale(1.4); }
  }

  .splash-hint{ margin-top:32px; font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); pointer-events:none; }
  .splash-hint .pulse{ display:inline-block; animation:hintPulse 1.6s ease-in-out infinite; }
  @keyframes hintPulse{ 0%,100%{ opacity:.4; transform:scale(1); color:var(--ink-faint); } 50%{ opacity:1; transform:scale(1.06); color:var(--accent); } }
  .splash-btn{ position:absolute; inset:0; border:none; background:none; cursor:pointer; width:100%; height:100%; }

  .lang-title{ font-weight:900; font-size:clamp(1.6rem,4vw,2.2rem); margin-bottom:34px; }
  .lang-choices{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .lang-btn{
    border:1.5px solid var(--line); background:none; color:var(--ink); cursor:pointer;
    padding:18px 40px; border-radius:999px; font-size:1rem; font-weight:700;
    transition:border-color .35s var(--ease), background .35s var(--ease), color .35s var(--ease), transform .35s var(--ease);
  }
  .lang-btn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }

  /* ================= app shell (fills viewport, no scroll) ================= */
  #app{ opacity:0; display:flex; flex-direction:column; height:100%; }

  .topbar{
    flex:none;
    display:flex; align-items:center; gap:14px; padding:clamp(8px,1.6vh,14px) 22px;
    border-bottom:1px solid var(--line);
  }
  .topbar img.logo{ height:19px; width:auto; flex:none; }
  .topbar .divider{ width:1px; height:17px; background:var(--line); flex:none; }
  .topbar h1{ font-weight:900; font-size:clamp(.95rem,1.8vw,1.2rem); letter-spacing:-.01em; }
  .topbar .lang-toggle{
    margin-left:auto; display:flex; gap:2px; font-size:.7rem; font-weight:700; letter-spacing:.04em;
  }
  .topbar .lang-toggle button{ border:none; background:none; cursor:pointer; padding:4px 8px; color:var(--ink-faint); border-radius:6px; }
  .topbar .lang-toggle button.active{ color:var(--accent); }
  .topbar-right{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .topbar-right .lang-toggle{ margin-left:0; }
  .icon-btn{ border:none; background:none; cursor:pointer; color:var(--ink-faint); padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition:color .25s var(--ease); }
  .icon-btn:hover{ color:var(--accent); }
  .icon-btn svg{ width:18px; height:18px; }

  .shell{ flex:1; min-height:0; display:flex; flex-direction:column; max-width:1240px; margin:0 auto; padding:0 22px; width:100%; }

  .lede{ flex:none; max-width:78ch; color:var(--ink-soft); font-size:clamp(.72rem,1.3vh,.86rem); line-height:1.4; padding:clamp(6px,1.2vh,12px) 0 0; }

  .view{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; justify-content:center; }

  /* ---------- family selector (top) ---------- */
  .family-top{ flex:none; padding:clamp(6px,1.4vh,14px) 0 2px; }
  .section-label{ font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }
  .filmstrip{
    display:flex; gap:clamp(16px,2.6vw,34px); overflow-x:auto; margin-top:clamp(4px,1vh,10px); padding:2px 2px clamp(6px,1.2vh,10px);
    scroll-snap-type:x proximity; -ms-overflow-style:none; scrollbar-width:none;
  }
  .filmstrip::-webkit-scrollbar{ display:none; }
  .film-item{
    background:none; border:none; padding:0 0 6px; cursor:pointer; flex:none;
    display:flex; flex-direction:column; align-items:center; gap:5px; width:clamp(46px,5.6vw,62px);
    opacity:.42; border-bottom:2px solid transparent;
    transition:opacity .45s var(--ease), border-color .45s var(--ease);
  }
  .film-item img{ width:clamp(34px,4.2vw,44px); height:clamp(34px,4.2vw,44px); object-fit:contain; }
  .film-item .film-label{ font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); white-space:nowrap; transition:color .45s var(--ease); }
  .film-item:hover{ opacity:.7; }
  .film-item.active{ opacity:1; border-color:var(--accent); }
  :root:not([data-theme="dark"]) .film-item{ opacity:.65; }
  :root:not([data-theme="dark"]) .film-item:hover{ opacity:.85; }
  :root:not([data-theme="dark"]) .film-item.active{ opacity:1; }
  .film-item.active .film-label{ color:var(--accent); }

  /* ---------- stage: image beside copy, no cards ---------- */
  .stage-split{
    flex:1; min-height:0; overflow:hidden;
    display:grid; grid-template-columns:1fr 1fr; gap:clamp(16px,4vw,48px); align-items:stretch;
    padding:clamp(4px,1vh,10px) 0;
  }
  .stage-figure-wrap{
    position:relative; height:100%; min-height:0; display:flex; align-items:center; justify-content:center;
    align-self:center; perspective:900px; touch-action:none;
  }
  #sonarField{ position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }
  .stage-word{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:clamp(2.4rem,9vh,6rem); letter-spacing:-.02em; text-transform:uppercase;
    white-space:nowrap; pointer-events:none; z-index:1; color:transparent;
    -webkit-text-stroke:1.2px var(--stage-word-stroke);
  }
  .tilt-wrap{
    position:relative; z-index:2; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    transition:transform .3s var(--ease); will-change:transform; transform-style:preserve-3d;
  }
  #heroImg{
    max-width:88%; max-height:34vh; object-fit:contain;
    -webkit-mask-image:radial-gradient(ellipse 82% 86% at 50% 52%, black 72%, transparent 100%);
    mask-image:radial-gradient(ellipse 82% 86% at 50% 52%, black 72%, transparent 100%);
    filter:drop-shadow(0 20px 24px var(--hero-shadow));
  }

  .stage-copy{
    display:flex; flex-direction:column; justify-content:flex-start; gap:clamp(6px,1.2vh,12px);
    will-change:transform,opacity; min-height:0; overflow-y:auto; overflow-x:hidden;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .stage-copy::-webkit-scrollbar{ display:none; }
  .eyebrow-cls{ font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .stage-copy h2{ font-weight:900; font-size:clamp(1.2rem,3.4vh,1.9rem); }
  .pill{ font-size:.64rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 11px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; align-self:flex-start; }
  .stage-tagline{ color:var(--ink-soft); font-size:clamp(.74rem,1.5vh,.88rem); line-height:1.45; max-width:58ch; }

  .spec-list{ margin-top:2px; padding-top:clamp(6px,1.2vh,12px); border-top:1px solid var(--line); }
  .spec-list .spec-row{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:clamp(4px,.9vh,8px) 0; border-bottom:1px solid var(--line); will-change:transform,opacity; }
  .spec-list .spec-row.wide{ flex-direction:column; align-items:flex-start; gap:3px; }
  .spec-list dt{ margin:0; font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:700; white-space:nowrap; }
  .spec-list dd{ margin:0; font-size:clamp(.72rem,1.3vh,.82rem); font-weight:500; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }
  .spec-list .spec-row.wide dd{ text-align:left; color:var(--ink-soft); font-weight:400; }

  .tier-btn{
    align-self:flex-start; display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font:inherit; font-size:.72rem; font-weight:700; letter-spacing:.04em; padding:8px 16px; border-radius:999px;
    border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent);
    transition:background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
  }
  .tier-btn::after{ content:'\2197'; font-size:.9em; }
  .tier-btn:hover{ background:var(--accent); color:#fff; transform:translateY(-1px); }

  .tier-modal{
    position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:clamp(12px,3vh,32px) 16px;
    background:rgba(7,12,23,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  .tier-modal[hidden]{ display:none; }
  .tier-panel{
    width:min(1020px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden;
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 30px 80px rgba(7,12,23,.45);
  }
  .tier-head{ flex:none; display:flex; align-items:center; gap:20px; padding:18px 22px 14px; border-bottom:1px solid var(--line); }
  .tier-head-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .tier-head h3{ margin:0; font-size:clamp(1rem,2.2vh,1.3rem); font-weight:800; letter-spacing:-.01em; }
  .tier-toggle{ display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-size:.72rem; font-weight:600; color:var(--ink-soft); user-select:none; }
  .tier-toggle input{ position:absolute; opacity:0; pointer-events:none; }
  .tier-switch{ position:relative; width:34px; height:20px; border-radius:999px; background:var(--line); transition:background .25s var(--ease); flex:none; }
  .tier-switch::after{ content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .25s var(--ease); }
  .tier-toggle input:checked + .tier-switch{ background:var(--accent); }
  .tier-toggle input:checked + .tier-switch::after{ transform:translateX(14px); }
  .tier-toggle input:focus-visible + .tier-switch{ outline:2px solid var(--accent); outline-offset:3px; }
  .tier-close{ flex:none; }

  .tier-scroll{ flex:1; min-height:0; overflow:auto; padding:0 22px 6px; }
  .tier-table{ border-collapse:separate; border-spacing:0; width:100%; }
  .tier-table th, .tier-table td{ padding:11px 14px; text-align:left; vertical-align:middle; font-size:.8rem; line-height:1.35; border-bottom:1px solid var(--line); }
  .tier-table thead th{ position:sticky; top:0; z-index:2; background:var(--teal); color:#fff; font-weight:700; font-size:.76rem; letter-spacing:.02em; border-bottom:0; white-space:nowrap; }
  .tier-table thead th:first-child{ border-top-left-radius:10px; }
  .tier-table thead th:last-child{ border-top-right-radius:10px; }
  .tier-table thead th.col{ text-align:center; }
  .tier-table tbody th.grp{ width:24%; font-weight:700; font-size:.8rem; color:var(--ink); background:var(--accent-soft); border-right:1px solid var(--line); }
  .tier-table tbody th.sub{ width:20%; font-weight:400; color:var(--ink-soft); }
  .tier-table tbody td{ text-align:center; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-weight:400; }
  .tier-table tbody tr.diff td{ color:var(--ink); font-weight:700; background:var(--accent-soft); }
  .tier-table tbody tr.diff th.sub{ color:var(--ink); }
  .tier-table tbody tr.grp-start th, .tier-table tbody tr.grp-start td{ border-top:1px solid var(--line); }
  .tier-table tbody tr:last-child th, .tier-table tbody tr:last-child td{ border-bottom:0; }
  .tier-legend{ flex:none; display:flex; align-items:center; gap:8px; padding:12px 22px; border-top:1px solid var(--line); font-size:.7rem; color:var(--ink-faint); }
  .tier-legend span:nth-child(odd){ width:14px; height:14px; border-radius:4px; flex:none; }
  .tier-legend .lg-diff{ background:var(--accent-soft); border:1px solid var(--accent); }
  .tier-legend .lg-same{ background:transparent; border:1px solid var(--line); margin-left:14px; }
  @media (max-width:820px){
    .tier-head{ flex-wrap:wrap; gap:10px 14px; padding:14px 16px 12px; }
    .tier-head-text{ flex-basis:100%; order:1; }
    .tier-toggle{ order:2; flex:1; }
    .tier-close{ order:3; }
    .tier-scroll{ padding:0 12px 6px; }
    .tier-table th, .tier-table td{ padding:9px 8px; font-size:.7rem; }
    .tier-table tbody th.grp{ width:auto; }
  }

  /* ---------- compare (flat, no cards) ---------- */
  #compare{ padding-top:clamp(8px,1.6vh,20px); }
  .compare-pickers-flat{ flex:none; display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-bottom:4px; }
  .picker-flat .section-label.accent-a{ color:var(--accent); }
  .picker-flat .section-label.accent-b{ color:var(--purple); }
  .thumb-row-flat{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .thumb-flat{
    border:none; background:none; cursor:pointer; padding:0 0 6px; opacity:.4;
    border-bottom:2px solid transparent; transition:opacity .3s var(--ease), border-color .3s var(--ease);
  }
  .thumb-flat img{ width:36px; height:36px; object-fit:contain; display:block; }
  .thumb-flat[disabled]{ opacity:.15; cursor:not-allowed; pointer-events:none; }
  .picker-flat.slot-a .thumb-flat.selected{ opacity:1; border-color:var(--accent); }
  .picker-flat.slot-b .thumb-flat.selected{ opacity:1; border-color:var(--purple); }

  .compare-table-wrap{ flex:1; min-height:0; overflow:auto; margin-top:14px; }
  table.compare-table{ border-collapse:collapse; width:100%; min-width:480px; }
  .compare-table thead th{ text-align:left; padding:0 16px 10px 0; vertical-align:bottom; border-bottom:1px solid var(--ink); }
  .col-head{ display:flex; align-items:center; gap:9px; }
  .col-head .thumb-mini{ width:32px; height:32px; flex:none; }
  .col-head .thumb-mini img{ width:100%; height:100%; object-fit:contain; display:block; }

  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.55), t0 + dur);

    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }catch(err){ /* audio unavailable — fail silently */ }
}

/* ================= splash -> language -> app sequence ================= */
function crossfadeOut(el, cb){
  if(REDUCE_MOTION){ el.hidden = true; cb(); return; }
  el.animate([{opacity:1},{opacity:0}], {duration:420, easing:EASE_IN, fill:'forwards'}).finished.then(()=>{
    el.hidden = true; cb();
  });
}
function crossfadeIn(el){
  el.hidden = false;
  if(REDUCE_MOTION){ el.style.opacity = 1; return; }
  el.animate([{opacity:0},{opacity:1}], {duration:560, easing:EASE_OUT, fill:'forwards'});
}

document.getElementById('splashBtn').addEventListener('click', ()=>{
  sndConfirm();
  crossfadeOut(document.getElementById('splash'), ()=>{
    crossfadeIn(document.getElementById('langSelect'));
  });
});

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    sndConfirm();
    LANG = btn.dataset.lang;
    crossfadeOut(document.getElementById('langSelect'), ()=>{

      else app.animate([{opacity:0},{opacity:1}], {duration:620, easing:EASE_OUT, fill:'forwards'}).finished.then(()=>{ app.style.opacity = 1; });
    });
  });
});

/* ================= theme (light/dark) ================= */
function syncThemeIcon(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  /* toggleAttribute (not the .hidden IDL property) — SVGElement's reflection
     of .hidden is inconsistent, so setting the property silently no-ops. */
  document.getElementById('themeIconSun').toggleAttribute('hidden', dark);
  document.getElementById('themeIconMoon').toggleAttribute('hidden', !dark);
  const logoSrc = dark ? 'assets/logo/sonardyne-logo-white.svg' : 'assets/logo/sonardyne-logo.svg';
  document.querySelectorAll('.theme-logo').forEach(img=>{ img.src = logoSrc; });
}
document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
  sndTab();
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('sprintnav-theme', next); }catch(err){ /* private mode — theme just won't persist */ }
  syncThemeIcon();
});
syncThemeIcon();

function buildSpecList(p){
  const d = tr(p), L = t().labels;
  const rows = [
    [L.depth, d.depthDisplay || (p.depthRatingM.toLocaleString(t().locale) + ' m')],
    [L.dims, d.dims],
    [L.weight, d.weightDisplay],
    [L.dvl, d.dvl],
    [L.heading, d.headingDisplay],
    [L.pitchroll, d.pitchRollDisplay],
    [L.distance, d.distanceDisplay],
    [L.power, d.powerDisplay],
  ];
  if(d.stationKeeping) rows.push([L.stationKeeping, d.stationKeeping]);
  else if(d.unaided) rows.push([L.unaided, d.unaided]);

  const list = document.getElementById('specList');
  const tierBtn = document.getElementById('tierBtn');
  tierBtn.hidden = !d.tierTable;
  tierBtn.textContent = L.tierBtn;
  list.innerHTML = rows.map(([dt,dd])=>`<div class="spec-row"><dt>${dt}</dt><dd>${dd}</dd></div>`).join('')
    + `<div class="spec-row wide"><dt>${L.applications}</dt><dd>${tagRow(d.applications)}</dd></div>`;

  if(!REDUCE_MOTION){
    list.querySelectorAll('.spec-row').forEach((row,i)=>{
      row.animate([{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'translateY(0)'}],
        {duration:420, delay:i*45, easing:EASE_OUT, fill:'both'});
    });
  }
}

const ACC_DATA = [
  { k:'x',  label:'X*', dist:0.04, survey:0.01 },
  { k:'s',  label:'S',  dist:0.06, survey:0.02 },
  { k:'i',  label:'I',  dist:0.10, survey:0.03 },
  { k:'m',  label:'M',  dist:0.20, survey:0.05 },
  { k:'ux', label:'UX', dist:0.30, survey:0.05 },
  { k:'u',  label:'U',  dist:0.45, survey:0.10 }
];

function renderAccuracy(){
  const A = t().acc;
  const fmt = v => v.toFixed(2).replace('.', A.dec) + '%';
  const R = 1000, mx = 460, my = 470, sx = 1010, sy = 500;
  const labelPos = k => k === 'u' ? -14 : 36;
  const distRings = [...ACC_DATA].reverse().map((r,i)=>{
    const rad = r.dist*R, ty = my + rad + labelPos(r.k);
    return `<g class="ring" data-k="${r.k}" style="--i:${i}"><circle class="hit" cx="${mx}" cy="${my}" r="${rad}"/><circle class="line" cx="${mx}" cy="${my}" r="${rad}"/>${r.k==='x'?'':`<text x="${mx}" y="${ty}">${r.label}</text>`}</g>`;
  }).join('');
  const bySurvey = new Map();
  ACC_DATA.forEach(r=>{ bySurvey.set(r.survey, [...(bySurvey.get(r.survey)||[]), r.k]); });
  const surveyRings = [...bySurvey.entries()].sort((a,b)=>b[0]-a[0]).map(([v,keys],i)=>
    `<g class="ring solid" data-k="${keys.join(' ')}" style="--i:${i+3}"><circle class="hit" cx="${sx}" cy="${sy}" r="${v*R}"/><circle class="line" cx="${sx}" cy="${sy}" r="${v*R}"/></g>`).join('');
  const rows = ACC_DATA.map(r=>`<tr data-k="${r.k}"><th scope="row">${r.label}</th><td>${fmt(r.dist)}</td><td>${fmt(r.survey)}</td></tr>`).join('');

  const layout = document.getElementById('accLayout');
  layout.innerHTML = `
    <div class="acc-copy">
      <h2>${A.title}</h2>
      <h3>${A.what}</h3>
      <ul>${A.bullets.map((b,i)=>`<li>${b}${i===2?`<ul><li>${A.sub}</li></ul>`:''}</li>`).join('')}</ul>
      <table class="acc-table">
        <thead><tr><th></th><th>${A.colDist}</th><th>${A.colSurvey}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="acc-foot">${A.foot}</p>
    </div>
    <div class="acc-figure">
      <svg class="acc-svg" viewBox="0 0 1240 950" role="img" aria-label="${A.aria}">
        ${distRings}${surveyRings}
        <text class="survey-label" x="${sx+78}" y="${sy+128}">${A.survey}</text>
      </svg>
    </div>`;

  const setOn = keys => layout.querySelectorAll('[data-k]').forEach(el=>{
    el.classList.toggle('on', !!keys && el.dataset.k.split(' ').some(k=>keys.includes(k)));
  });
  layout.onmouseover = e=>{ const el = e.target.closest('[data-k]'); setOn(el ? el.dataset.k.split(' ') : null); };
  layout.onmouseleave = ()=>setOn(null);
}

function tierTableHtml(tt, onlyDiff){
  const L = t().labels;
  const groups = tt.groups.map(([g,items])=>[g, items.map(([sub,vals])=>[sub, vals, new Set(vals).size>1]).filter(it=>!onlyDiff||it[2])]).filter(([,items])=>items.length);
  const body = groups.map(([g,items])=>items.map(([sub,vals,diff],i)=>
    `<tr class="${i===0?'grp-start ':''}${diff?'diff':''}">`
    + (i===0 ? `<th scope="rowgroup" class="grp"${sub===null?' colspan="2"':` rowspan="${items.length}"`}>${g}</th>` : '')
    + (sub===null ? '' : `<th scope="row" class="sub">${sub}</th>`)
    + vals.map(v=>`<td>${v}</td>`).join('') + '</tr>').join('')).join('');
  return `<table class="tier-table"><thead><tr><th colspan="2">${L.performance}</th>${tt.cols.map(c=>`<th class="col">SPRINT-Nav ${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}

  modal.hidden = true;

  if(REDUCE_MOTION){ paintHero(p); return; }

  await Promise.all([
    img.animate([{opacity:1, transform:'scale(1)', filter:'blur(0px)'},{opacity:0, transform:'scale(.94)', filter:'blur(10px)'}],
      {duration:260, easing:EASE_IN, fill:'forwards'}).finished,
    word.animate([{opacity:1},{opacity:0}], {duration:200, easing:EASE_IN, fill:'forwards'}).finished,
    copy.animate([{opacity:1, transform:'translateY(0)'},{opacity:0, transform:'translateY(-6px)'}],
      {duration:200, easing:EASE_IN, fill:'forwards'}).finished,
  ]);

  paintHero(p);
  emitCenterPing();

  /* Large product photos (500 KB–1.7 MB) can still be decoding on a slow
     connection; fading the <img> in before that finishes could paint a
     solid mask-colored block instead of the photo. Text/word fade in right
     away regardless — only the image itself waits on its own decode. */
  const fadeInImage = ()=> img.animate(
    [{opacity:0, transform:'scale(1.06)', filter:'blur(10px)'},{opacity:1, transform:'scale(1)', filter:'blur(0px)'}],
    {duration:620, easing:EASE_OUT, fill:'forwards'}
  );
  img.decode().then(fadeInImage, fadeInImage);
  word.animate([{opacity:0},{opacity:1}], {duration:700, delay:80, easing:EASE_OUT, fill:'forwards'});
  copy.animate([{opacity:0, transform:'translateY(14px)'},{opacity:1, transform:'translateY(0)'}],
    {duration:520, delay:120, easing:EASE_OUT, fill:'forwards'});
}

/* ================= sonar field: ambient pings + touch-reactive ripples + tilt =================
   Sonardyne builds sonar/acoustic navigation systems, so the product stage doubles as a small
   demo of the idea — concentric pings sweep outward on their own, and dragging a finger across
   the image sends its own ping (plus a subtle 3D tilt) from wherever the touch lands. */
let emitCenterPing = ()=>{};

function initSonarField(){
  const wrap = document.getElementById('stageWrap');
  const canvas = document.getElementById('sonarField');
  const tiltWrap = document.getElementById('tiltWrap');
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    const r = wrap.getBoundingClientRect();
    /* While the Family tab is hidden (other tab open, app not yet shown) the wrap measures 0x0.
       Shrinking the canvas to 1x1 then would get it CSS-stretched over the image, and every ring
       would paint that one pixel — a giant translucent blue block. Keep the last real size. */
    if(r.width < 2 || r.height < 2) return;
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  /* re-measure when the tab becomes visible again (or the layout changes without a window resize) */
  if(window.ResizeObserver) new ResizeObserver(resize).observe(wrap);

  let pings = [];
  function addPing(x, y, strong){ pings.push({ x, y, t0: performance.now(), strong: !!strong }); }
  emitCenterPing = ()=> addPing(w/2, h/2, true);

  (function ambientLoop(){
    if(!REDUCE_MOTION) addPing(w/2, h/2, false);
    setTimeout(ambientLoop, 2600 + Math.random()*500);
  })();

  /* The rAF loop below re-schedules itself at the very end of frame(); if any
     statement above that were ever to throw, the chain would die silently
     with no visible error — the classic way a canvas loop "just stops" after
     some later interaction. Wrapping the body means a bad frame is skipped
     instead of ending the animation for good. */
  function frame(now){
    try{
      if(!w || !h){ requestAnimationFrame(frame); return; }
      ctx.clearRect(0, 0, w, h);
      const maxR = Math.max(w, h) * 0.62;
      pings = pings.filter(p=>{
        const age = (now - p.t0) / 1000;
        const dur = p.strong ? 1.5 : 2.4;
        if(age <= 0 || age > dur) return age > 0;
        const k = Math.min(1, Math.max(0, age / dur));
        const r = Math.max(0.001, k * maxR * (p.strong ? 0.65 : 1));
        const alpha = Math.max(0, (1 - k) * (p.strong ? 0.5 : 0.2));
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(47,111,143,${alpha.toFixed(3)})`;
        ctx.lineWidth = p.strong ? 2 : 1.1;
        ctx.stroke();
        return true;
      });
    }catch(err){ /* skip this frame, keep the loop alive */ }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function localPoint(e){
    const r = wrap.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top, rw: r.width, rh: r.height };
  }

  let lastEmit = 0;
  function onMove(e){
    const { x, y, rw, rh } = localPoint(e);
    if(!rw || !rh) return;
    const now = performance.now();
    if(now - lastEmit > 240){ addPing(x, y, true); lastEmit = now; }
    if(!REDUCE_MOTION){
      const dx = (x / rw - 0.5) * 2, dy = (y / rh - 0.5) * 2;
      tiltWrap.style.transform = `rotateX(${(-dy*6).toFixed(2)}deg) rotateY(${(dx*8).toFixed(2)}deg)`;
    }
  }
  function onEnd(){ tiltWrap.style.transform = 'rotateX(0deg) rotateY(0deg)'; }

  wrap.addEventListener('pointerdown', (e)=>{ const {x,y} = localPoint(e); addPing(x, y, true); });
  wrap.addEventListener('pointermove', (e)=>{ if(e.buttons || e.pointerType === 'touch') onMove(e); });
  wrap.addEventListener('pointerleave', onEnd);
  wrap.addEventListener('pointerup', onEnd);
  wrap.addEventListener('touchmove', onMove, { passive:true });
  wrap.addEventListener('touchend', onEnd);
}

/* ================= compare ================= */
function renderThumbs(){
  const thumbsA = document.getElementById('thumbsA');
  const thumbsB = document.getElementById('thumbsB');
  thumbsA.innerHTML = PRODUCTS.map(p=>`<button class="thumb-flat ${p.id===slotA?'selected':''}" ${p.id===slotB?'disabled':''} data-id="${p.id}" title="${tr(p).name}"><img src="${p.image}" alt="${tr(p).name}"></button>`).join('');
  thumbsB.innerHTML = PRODUCTS.map(p=>`<button class="thumb-flat ${p.id===slotB?'selected':''}" ${p.id===slotA?'disabled':''} data-id="${p.id}" title="${tr(p).name}"><img src="${p.image}" alt="${tr(p).name}"></button>`).join('');
  thumbsA.querySelectorAll('.thumb-flat').forEach(c=>c.addEventListener('click', ()=>{ sndSelect(); slotA=c.dataset.id; renderThumbs(); renderCompare(); }));
  thumbsB.querySelectorAll('.thumb-flat').forEach(c=>c.addEventListener('click', ()=>{ sndSelect(); slotB=c.dataset.id; renderThumbs(); renderCompare(); }));
}

function miniThumb(p){ return `<div class="thumb-mini"><img src="${p.image}" alt="${tr(p).name}"></div>`; }

function renderCompare(){
  const a = PRODUCTS.find(x=>x.id===slotA);
  const b = PRODUCTS.find(x=>x.id===slotB);
  const L = t().labels;
  const METRICS = [
    { label:L.depth, get:p=>tr(p).depthDisplay || p.depthRatingM, format:v=>typeof v==='number' ? v.toLocaleString(t().locale)+' m' : v },
    { label:L.dims, get:p=>tr(p).dims, format:v=>v },
    { label:L.weight, get:p=>tr(p).weightDisplay, format:v=>v },
    { label:L.dvl, get:p=>tr(p).dvl, format:v=>v },
    { label:L.heading, get:p=>tr(p).headingDisplay, format:v=>v, leaderKey:'headingAccuracyDeg', better:'lower' },
    { label:L.pitchroll, get:p=>tr(p).pitchRollDisplay, format:v=>v, leaderKey:'pitchRollDeg', better:'lower' },
    { label:L.distance, get:p=>tr(p).distanceDisplay, format:v=>v, leaderKey:'distanceAccuracyPct', better:'lower' },
    { label:L.power, get:p=>tr(p).powerDisplay, format:v=>v, leaderKey:'powerW', better:'lower' },
    { label:`${L.unaided} / ${L.stationKeeping}`, get:p=>tr(p).unaided||tr(p).stationKeeping||'—', format:v=>v },
    { label:L.applications, get:p=>tr(p).applications.join(', '), format:v=>v }
  ];
  const table = document.getElementById('compareTable');
  const rows = METRICS.map(m=>{
    const va = m.get(a), vb = m.get(b);
    let aLead=false, bLead=false, isDiff = va !== vb;
    if(m.leaderKey && a[m.leaderKey]!==undefined && b[m.leaderKey]!==undefined && a[m.leaderKey]!==b[m.leaderKey]){
      const better = m.better==='lower' ? Math.min(a[m.leaderKey], b[m.leaderKey]) : Math.max(a[m.leaderKey], b[m.leaderKey]);
      aLead = a[m.leaderKey]===better; bLead = b[m.leaderKey]===better;
    }
    return `<tr>
      <th scope="row">${m.label}</th>
      <td class="${isDiff?'diff':''} ${aLead?'lead':''}">${aLead?'<span class="lead-mark">●</span>':''}${m.format(va)}</td>
      <td class="${isDiff?'diff':''} ${bLead?'lead':''}">${bLead?'<span class="lead-mark">●</span>':''}${m.format(vb)}</td>
    </tr>`;
  }).join('');

  table.innerHTML = `
    <thead>
      <tr>
        <th></th>
        <th><div class="col-head">${miniThumb(a)}<div><div class="fr-name">${tr(a).name}</div><div class="fr-class">${tr(a).cls}</div></div></div></th>
        <th><div class="col-head">${miniThumb(b)}<div><div class="fr-name">${tr(b).name}</div><div class="fr-class">${tr(b).cls}</div></div></div></th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  `;
}

/* ================= tabs ================= */
let switching = false;
async function switchView(view){
  if(switching) return;
  const current = document.querySelector('.view:not([hidden])');
  const target = document.getElementById(view);
  if(current === target) return;
  switching = true;
  if(REDUCE_MOTION){
    current.hidden = true; target.hidden = false;
  } else {
    await current.animate([{opacity:1, transform:'translateY(0)'},{opacity:0, transform:'translateY(10px)'}],
      {duration:220, easing:EASE_IN, fill:'forwards'}).finished;
    current.hidden = true;
    target.hidden = false;
    target.animate([{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'translateY(0)'}],
      {duration:460, easing:EASE_OUT, fill:'forwards'});
  }
  switching = false;
}

function moveTabIndicator(btn){
  const bar = document.querySelector('.tabbar');
  const indicator = document.getElementById('tabIndicator');
  const barRect = bar.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  indicator.style.width = (btnRect.width * 0.5) + 'px';
  indicator.style.transform = `translateX(${btnRect.left - barRect.left + btnRect.width*0.25}px)`;
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(!btn.classList.contains('active')) sndTab();
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    moveTabIndicator(btn);
    switchView(btn.dataset.view);
    if(btn.dataset.view === 'threed'){
      requestAnimationFrame(()=> requestAnimationFrame(()=> window.dispatchEvent(new Event('resize'))));
    }
  });
});

window.addEventListener('resize', ()=>{
  const active = document.querySelector('.tab-btn.active');
  if(active) moveTabIndicator(active);
});

initSonarField();
requestAnimationFrame(()=> moveTabIndicator(document.querySelector('.tab-btn.active')));
</script>

<!-- ================= 3D interactive model (Three.js) ================= -->
<script>
(function(){
  if(typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') return; // three.js/addon failed to load (offline / blocked CDN)
  const wrap = document.getElementById('threeCanvasWrap');
  const canvas = document.getElementById('threeCanvas');
  const loading = document.getElementById('threeLoading');
  const section = document.getElementById('threed');
  if(!wrap || !canvas || !section) return;

  const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
  camera.position.set(2.65, 1.2, 3.25);

  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
  }catch(err){ if(loading) loading.textContent = 'WebGL indisponível'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  /* No PMREM/environment map here — this build intentionally skips three.js's
     ES-module addons (RoomEnvironment, and OrbitControls would otherwise come
     from examples/jsm too) because `import` is blocked by browsers when the
     page is opened directly as a file:// document instead of via a server.
     A few extra lights stand in for the reflections an env map would add. */
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 5, 2);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x9fd8ff, 0.6);
  fill.position.set(-4, 2, -3);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.5);
  rim.position.set(-1, -2, -4);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0x556677, 0.55));
  scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x1a2230, 0.9));

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.05, 0);
  controls.enablePan = false;
  controls.minDistance = 2.0;
  controls.maxDistance = 5.8;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = Math.PI - 0.35;
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = !REDUCE_MOTION;
  controls.autoRotateSpeed = 1.1;
  controls.update();
  controls.addEventListener('start', ()=>{ controls.autoRotate = false; });

  /* ---------- SPRINT-Nav U/UX procedural model ----------
     Modelled to match the Sonardyne SPRINT-Nav U/UX reference photo/drawing
     rather than the datasheet's numeric dimensions: the transducer face
     (bottom) reads visibly WIDER than the mounting face (top), flaring out
     like the real housing. Bottom = transducer end: 4x DVL heads (Janus
     array, 45°), 4x M3 holes for the optional mounting ring, yellow
     orientation mark. Top = mounting end: 4x M5 bolts, centre datum mark,
     penetrator cable exiting and draping down the side. */
  const device = new THREE.Group();
  scene.add(device);

  const metalMat = new THREE.MeshStandardMaterial({ color:0xdfe3e5, metalness:0.75, roughness:0.32 });
  const capMat   = new THREE.MeshStandardMaterial({ color:0xc4cacd, metalness:0.88, roughness:0.3 });
  const darkMat  = new THREE.MeshStandardMaterial({ color:0x1b1d21, metalness:0.35, roughness:0.55 });
  const boltMat  = new THREE.MeshStandardMaterial({ color:0x2a2d31, metalness:0.7, roughness:0.4 });
  const markMat  = new THREE.MeshStandardMaterial({ color:0xf2c300, metalness:0.1, roughness:0.5 });

  const HEIGHT = 1.2;
  const RADIUS_BOTTOM = 0.6; // transducer end — the wider face where the sonar fires, per the reference image
  const RADIUS_TOP = RADIUS_BOTTOM * 0.93; // mounting end — a touch narrower, per the reference image

  const body = new THREE.Mesh(new THREE.CylinderGeometry(RADIUS_TOP, RADIUS_BOTTOM, HEIGHT, 96), metalMat);
  device.add(body);

  function bevelRing(radius){
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(radius * 0.985, radius * 0.035, 12, 96),
      capMat
    );
    ring.rotation.x = Math.PI / 2;
    return ring;
  }

  function radiusAtY(y){
    const t = (y + HEIGHT / 2) / HEIGHT;
    return THREE.MathUtils.lerp(RADIUS_BOTTOM, RADIUS_TOP, t);
  }

  function makeBandTexture(){
    const c = document.createElement('canvas'); c.width = 1536; c.height = 320;
    const ctx = c.getContext('2d');
    /* The band wraps the full 360° of the cylinder, so the brand mark is
       painted twice (front and back) — otherwise it would only ever face
       the camera from one specific rotation angle. */
    function paintBlock(cx, logoImg){
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // fit "SPRINT-Nav" to most of this block's half of the band, so the
      // mark stays visible through nearly the whole rotation instead of
      // only at the two exact angles it's centred on.
      const targetW = c.width * 0.42;
      let fontSize = 100;
      ctx.font = `700 ${fontSize}px Satoshi, Helvetica, Arial, sans-serif`;
      const measured = ctx.measureText('SPRINT-Nav').width;
      fontSize = Math.round(fontSize * (targetW / measured));
      ctx.font = `700 ${fontSize}px Satoshi, Helvetica, Arial, sans-serif`;

      let logoDrawn = false;
      if(logoImg && logoImg.naturalWidth){
        try{
          const logoH = fontSize * 0.62, logoW = logoH * (logoImg.naturalWidth / logoImg.naturalHeight);
          ctx.drawImage(logoImg, cx - logoW / 2, c.height * 0.25 - logoH / 2, logoW, logoH);
          logoDrawn = true;
        }catch(err){ /* SVG failed to rasterize — fall back to text below */ }
      }
      if(!logoDrawn){
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.font = `700 ${Math.round(fontSize * 0.5)}px Satoshi, Helvetica, Arial, sans-serif`;
        ctx.fillText('Sonardyne', cx, c.height * 0.25);
        ctx.font = `700 ${fontSize}px Satoshi, Helvetica, Arial, sans-serif`;
      }
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.fillText('SPRINT-Nav', cx, c.height * 0.68);
    }
    function paint(logoImg){
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#1f2f66'; ctx.fillRect(0, 0, c.width, c.height);
      paintBlock(c.width * 0.25, logoImg);
      paintBlock(c.width * 0.75, logoImg);
    }
    paint(null);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 8;

  }
  const bandMat = new THREE.MeshStandardMaterial({ map:makeBandTexture(), metalness:0.15, roughness:0.6 });
  // Fixed absolute height — NOT scaled with HEIGHT — so the label band (and
  // the text/logo painted on it) keeps its proportions when the body is
  // stretched taller, instead of the same texture being stretched vertically.
  const bandH = 0.52, bandCenterY = HEIGHT * 0.12;
  const band = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radiusAtY(bandCenterY + bandH / 2) * 1.008,
      radiusAtY(bandCenterY - bandH / 2) * 1.008,
      bandH, 96, 1, true
    ),
    bandMat
  );
  band.position.y = bandCenterY;
  device.add(band);

  // ---- top: mounting face (Ø118) — 4x M5 bolts on 104 mm PCD, centre datum ----
  const topY = HEIGHT / 2;
  const topBevel = bevelRing(RADIUS_TOP); topBevel.position.y = topY; device.add(topBevel);
  const BOLT_PCD_RATIO = 104 / 118;
  for(let i = 0; i < 4; i++){
    const a = i * (Math.PI / 2) + Math.PI / 4;
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.02, 16), boltMat);
    bolt.position.set(Math.cos(a) * RADIUS_TOP * BOLT_PCD_RATIO, topY + 0.001, Math.sin(a) * RADIUS_TOP * BOLT_PCD_RATIO);
    device.add(bolt);
  }
  const centerCross = new THREE.Group();
  [0, Math.PI / 2].forEach(rot=>{
    const bar = new THREE.Mesh(new THREE.BoxGeometry(RADIUS_TOP * 0.16, 0.004, 0.006), darkMat);
    bar.rotation.y = rot;
    centerCross.add(bar);
  });
  centerCross.position.set(0, topY + 0.002, 0);
  device.add(centerCross);

  // ---- bottom: transducer face (Ø114) — 4x DVL heads, M3 ring holes, orientation mark ----
  const bottomY = -HEIGHT / 2;
  const bottomBevel = bevelRing(RADIUS_BOTTOM); bottomBevel.position.y = bottomY; device.add(bottomBevel);
  const bottomCap = new THREE.Mesh(new THREE.CylinderGeometry(RADIUS_BOTTOM * 0.98, RADIUS_BOTTOM * 0.98, 0.025, 96), capMat);
  bottomCap.position.y = bottomY - 0.012;
  device.add(bottomCap);

  const transducerPositions = [];
  for(let i = 0; i < 4; i++){
    const a = i * (Math.PI / 2) + Math.PI / 4;
    const r = RADIUS_BOTTOM * 0.5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    transducerPositions.push(new THREE.Vector3(x, bottomY - 0.027, z));
    const head = new THREE.Mesh(new THREE.CylinderGeometry(RADIUS_BOTTOM * 0.34, RADIUS_BOTTOM * 0.34, 0.03, 48), darkMat);
    head.position.set(x, bottomY - 0.027, z);
    device.add(head);
  }
  // M3 optional mounting-ring holes, offset 45° from the transducer heads
  for(let i = 0; i < 4; i++){
    const a = i * (Math.PI / 2);
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.018, 12), boltMat);
    hole.position.set(Math.cos(a) * RADIUS_BOTTOM * 0.86, bottomY - 0.014, Math.sin(a) * RADIUS_BOTTOM * 0.86);
    device.add(hole);
  }
  // yellow orientation/warning mark near the rim
  const mark = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.001, 3), markMat);
  mark.rotation.x = -Math.PI / 2;
  mark.position.set(Math.cos(Math.PI * 0.85) * RADIUS_BOTTOM * 0.86, bottomY - 0.013, Math.sin(Math.PI * 0.85) * RADIUS_BOTTOM * 0.86);
  device.add(mark);

  const cableCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(RADIUS_BOTTOM * 0.92, bottomY + 0.03, 0),
    new THREE.Vector3(RADIUS_BOTTOM * 1.22, bottomY - 0.09, 0),
    new THREE.Vector3(RADIUS_BOTTOM * 1.1, bottomY - 0.33, 0),
    new THREE.Vector3(RADIUS_BOTTOM * 0.85, bottomY - 0.54, 0),
  ]);

  device.add(cable);

  device.rotation.x = 0.02;

  const floorY = bottomY - 1.15;
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(2.6, 64),
    new THREE.MeshStandardMaterial({ color:0x0a1a2c, metalness:0.1, roughness:0.9, transparent:true, opacity:0.5 })

  floor.position.y = floorY;
  scene.add(floor);

  floorGrid.position.y = floorY + 0.001;
  floorGrid.material.transparent = true;
  floorGrid.material.opacity = 0.22;
  scene.add(floorGrid);

  /* ---------- sonar probe: fires from each DVL head, echoes off the seabed ---------- */
  const pulses = [];
  const probeGeo = new THREE.SphereGeometry(0.045, 16, 16);

  function ringMesh(){
    const geo = new THREE.RingGeometry(0.05, 0.15, 48);
    const mat = new THREE.MeshBasicMaterial({ color:0x33f3fd, transparent:true, opacity:0.75, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    return mesh;
  }

  let firing = false;
  function fireProbe(){
    if(firing) return;
    firing = true;
    transducerPositions.forEach((pos, i)=>{
      const sphere = new THREE.Mesh(probeGeo, new THREE.MeshBasicMaterial({ color:0x33f3fd, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
      sphere.position.copy(pos);
      scene.add(sphere);
      pulses.push({ mesh:sphere, kind:'probe', fromY:pos.y, x:pos.x, z:pos.z, start:performance.now(), dur:950 + i * 35 });
    });
    setTimeout(()=>{ firing = false; }, 260);
  }

  (function autoFireLoop(){
    fireProbe();
    setTimeout(autoFireLoop, 2600 + Math.random() * 1400);
  })();

  /* Tablet-friendly touch: a quick tap on the model fires an extra probe
     right away, without a button and without fighting the drag-to-rotate
     gesture OrbitControls already owns (a tap moves very little and lifts
     quickly; a rotate drag moves further or takes longer). */
  let tapStart = null;
  renderer.domElement.addEventListener('pointerdown', (e)=>{
    tapStart = { x:e.clientX, y:e.clientY, t:performance.now() };
  });
  renderer.domElement.addEventListener('pointerup', (e)=>{
    if(!tapStart) return;
    const dx = e.clientX - tapStart.x, dy = e.clientY - tapStart.y;
    const dist = Math.hypot(dx, dy);
    const dur = performance.now() - tapStart.t;
    tapStart = null;
    if(dist < 12 && dur < 350) fireProbe();
  });

  function updatePulses(now){
    for(let i = pulses.length - 1; i >= 0; i--){
      const p = pulses[i];
      const t = Math.min(1, (now - p.start) / p.dur);
      if(p.kind === 'probe'){
        p.mesh.position.y = THREE.MathUtils.lerp(p.fromY, floorY, t);
        p.mesh.material.opacity = 0.95 * (1 - t * 0.3);
        const s = 1 + t * 0.7;
        p.mesh.scale.set(s, s, s);
        if(t >= 1){
          scene.remove(p.mesh);
          pulses.splice(i, 1);
          const echo = ringMesh();
          echo.position.set(p.x, floorY + 0.02, p.z);
          scene.add(echo);
          pulses.push({ mesh:echo, kind:'echo', start:now, dur:1100 });
        }
      } else {
        const s = 1 + t * 9;
        p.mesh.scale.set(s, s, s);
        p.mesh.material.opacity = 0.75 * (1 - t);
        if(t >= 1){ scene.remove(p.mesh); pulses.splice(i, 1); }
      }
    }
  }

  function resize(){
    const r = wrap.getBoundingClientRect();
    if(r.width < 2 || r.height < 2) return;
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
    renderer.setSize(r.width, r.height, false);
  }
  window.addEventListener('resize', resize);
  resize();

  function loop(now){
    requestAnimationFrame(loop);
    if(section.hidden) return;
    controls.update();
    updatePulses(now || performance.now());
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);

  if(loading){
    loading.style.opacity = '0';
    setTimeout(()=>{ loading.hidden = true; }, 500);
  }
