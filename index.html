<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codexti</title>
<meta name="description" content="Codexti — Engenharia de Software.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cx-green: #0da65f;
    --cx-green-2: #11d97c;
    --cx-ink: #0d1a13;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Ubuntu", sans-serif;
    cursor: default;
  }

  canvas#net {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* animated grid */
  .grid {
    position: fixed;
    inset: -2px;
    z-index: 0;
    background-image:
      linear-gradient(rgba(13,166,95,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,166,95,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.9) 0%, transparent 72%);
            mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.9) 0%, transparent 72%);
    animation: grid-drift 16s linear infinite;
  }

  @keyframes grid-drift {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 48px 48px, 48px 48px; }
  }

  /* mouse spotlight */
  .spotlight {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(17,217,124,0.10), transparent 65%);
    transition: opacity 0.3s ease;
  }

  /* HUD corners */
  .hud {
    position: fixed;
    inset: 22px;
    z-index: 3;
    pointer-events: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: rgba(13,166,95,0.55);
    opacity: 0;
    animation: fade-in 1s ease 1s forwards;
  }

  .hud .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--cx-green);
    opacity: 0.5;
  }
  .hud .tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .hud .tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .hud .bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .hud .br { bottom: 0; right: 0; border-left: none; border-top: none; }

  .hud .status {
    position: absolute;
    top: 0;
    left: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  .hud .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cx-green-2);
    animation: blink 1.4s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(17,217,124,0.9);
  }

  .hud .coords {
    position: absolute;
    bottom: 0;
    right: 34px;
  }

  /* stage */
  .stage {
    position: relative;
    z-index: 2;
    text-align: center;
    user-select: none;
  }

  .kicker {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(0.65rem, 1.4vw, 0.85rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cx-green);
    margin-bottom: 18px;
    opacity: 0;
    animation: fade-in 1s ease 0.2s forwards;
  }

  .brand-wrap {
    position: relative;
    display: inline-block;
  }

  h1.brand {
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-size: clamp(3rem, 13vw, 8.5rem);
    color: var(--cx-ink);
    line-height: 1;
    position: relative;
  }

  h1.brand .fx {
    background: linear-gradient(100deg, var(--cx-green) 0%, var(--cx-green-2) 40%, var(--cx-ink) 55%, var(--cx-green-2) 70%, var(--cx-green) 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sheen 5s linear infinite;
    text-shadow: 0 0 40px rgba(17,217,124,0.18);
  }

  /* glitch layers, activated by .glitching on brand-wrap */
  h1.brand .glitch-layer {
    position: absolute;
    inset: 0;
    color: var(--cx-green-2);
    opacity: 0;
    -webkit-background-clip: initial;
    background-clip: initial;
    background: none;
    pointer-events: none;
  }

  .brand-wrap.glitching .glitch-layer.g1 {
    opacity: 0.75;
    color: #ff2e63;
    mix-blend-mode: multiply;
    animation: glitch-shift-1 0.35s steps(2, end);
  }
  .brand-wrap.glitching .glitch-layer.g2 {
    opacity: 0.75;
    color: #11d9d9;
    mix-blend-mode: multiply;
    animation: glitch-shift-2 0.35s steps(2, end);
  }
  .brand-wrap.glitching h1.brand > .fx {
    animation: sheen 5s linear infinite, glitch-skew 0.35s steps(2, end);
  }

  @keyframes glitch-shift-1 {
    0% { transform: translate(0, 0); clip-path: inset(10% 0 60% 0); }
    25% { transform: translate(-6px, 2px); clip-path: inset(60% 0 5% 0); }
    50% { transform: translate(5px, -2px); clip-path: inset(20% 0 40% 0); }
    75% { transform: translate(-3px, 1px); clip-path: inset(5% 0 70% 0); }
    100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 0; }
  }
  @keyframes glitch-shift-2 {
    0% { transform: translate(0, 0); clip-path: inset(50% 0 10% 0); }
    25% { transform: translate(6px, -1px); clip-path: inset(5% 0 65% 0); }
    50% { transform: translate(-5px, 2px); clip-path: inset(35% 0 30% 0); }
    75% { transform: translate(4px, -1px); clip-path: inset(65% 0 5% 0); }
    100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 0; }
  }
  @keyframes glitch-skew {
    0% { filter: none; }
    25% { filter: blur(0.3px); transform: skewX(1.2deg); }
    50% { filter: blur(0.5px); transform: skewX(-1deg); }
    75% { filter: blur(0.2px); transform: skewX(0.6deg); }
    100% { filter: none; transform: none; }
  }

  /* scanline sweep */
  .scan {
    position: absolute;
    left: -6%;
    right: -6%;
    height: 3px;
    top: 0;
    background: linear-gradient(90deg, transparent, rgba(17,217,124,0.55), transparent);
    opacity: 0;
    pointer-events: none;
  }
  .brand-wrap.glitching .scan {
    opacity: 1;
    animation: scan-sweep 0.5s ease-out;
  }
  @keyframes scan-sweep {
    0% { top: -10%; opacity: 1; }
    100% { top: 110%; opacity: 0; }
  }

  .cursor {
    display: inline-block;
    width: 0.06em;
    margin-left: 0.05em;
    background: var(--cx-green-2);
    animation: blink 1s step-end infinite;
  }

  .tag {
    margin-top: 22px;
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(0.75rem, 1.6vw, 0.95rem);
    color: #6b7a70;
    min-height: 1.4em;
    opacity: 0;
    animation: fade-in 1s ease 0.6s forwards;
  }

  .tag .caret {
    display: inline-block;
    width: 0.5em;
    color: var(--cx-green-2);
    animation: blink 1s step-end infinite;
  }

  .project-link {
    display: inline-block;
    margin-top: 28px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: #6b7a70;
    border: 1px solid rgba(13,166,95,0.25);
    padding: 8px 16px;
    border-radius: 999px;
    opacity: 0;
    animation: fade-in 1s ease 1s forwards;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .project-link:hover {
    color: var(--cx-ink);
    border-color: var(--cx-green-2);
    background: rgba(17,217,124,0.06);
  }

  @keyframes sheen {
    0% { background-position: 0% 0%; }
    100% { background-position: 300% 0%; }
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    h1.brand .fx { animation: none; background-position: 0 0; }
    .cursor, .tag .caret { animation: none; opacity: 1; }
    .grid { animation: none; }
  }
</style>
</head>
<body>

<div class="grid"></div>
<canvas id="net"></canvas>
<div class="spotlight" id="spotlight"></div>

<div class="hud">
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>
  <span class="status"><span class="dot"></span>SYSTEM ONLINE</span>
  <span class="coords" id="hud-coords">X:0000 Y:0000</span>
</div>

<div class="stage">
  <span class="kicker">Codexti Dev</span>
  <div class="brand-wrap" id="brandWrap">
    <h1 class="brand">
      <span class="fx">Codexti</span><span class="cursor">&nbsp;</span>
      <span class="glitch-layer g1" aria-hidden="true">Codexti</span>
      <span class="glitch-layer g2" aria-hidden="true">Codexti</span>
      <span class="scan"></span>
    </h1>
  </div>
  <div class="tag"><span id="tagText"></span><span class="caret">_</span></div>
  <a class="project-link" href="/sonardyne/">Sonardyne / SPRINT-Nav →</a>
</div>

<script>
(function () {
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, points, bursts = [];
  var mouse = { x: null, y: null };

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.round((w * h) / 20000);
    points = [];
    for (var i = 0; i < count; i++) {
      points.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35
      });
    }
  }

  function step() {
    ctx.clearRect(0, 0, w, h);
    var linkDist = Math.min(150, w / 6);

    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;

      if (mouse.x !== null) {
        var dx = p.x - mouse.x, dy = p.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 12000) {
          var f = (12000 - d2) / 12000 * 0.02;
          p.vx += dx * f * 0.02;
          p.vy += dy * f * 0.02;
        }
      }
    }

    for (var i = 0; i < points.length; i++) {
      for (var j = i + 1; j < points.length; j++) {
        var a = points[i], b = points[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < linkDist) {
          var alpha = (1 - dist / linkDist) * 0.35;
          ctx.strokeStyle = 'rgba(13,166,95,' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(13,166,95,0.55)';
      ctx.fill();
    }

    // click bursts
    for (var i = bursts.length - 1; i >= 0; i--) {
      var b = bursts[i];
      b.r += 6;
      b.alpha -= 0.02;
      if (b.alpha <= 0) { bursts.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(17,217,124,' + b.alpha + ')';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    requestAnimationFrame(step);
  }

  var spotlight = document.getElementById('spotlight');
  var hudCoords = document.getElementById('hud-coords');

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    spotlight.style.setProperty('--mx', e.clientX + 'px');
    spotlight.style.setProperty('--my', e.clientY + 'px');
    hudCoords.textContent = 'X:' + String(e.clientX).padStart(4, '0') + ' Y:' + String(e.clientY).padStart(4, '0');
  });
  window.addEventListener('mouseleave', function () {
    mouse.x = null;
    mouse.y = null;
  });
  window.addEventListener('click', function (e) {
    bursts.push({ x: e.clientX, y: e.clientY, r: 4, alpha: 0.9 });
  });

  resize();
  requestAnimationFrame(step);
})();

// periodic glitch effect on the brand text
(function () {
  var wrap = document.getElementById('brandWrap');
  function glitch() {
    wrap.classList.add('glitching');
    setTimeout(function () { wrap.classList.remove('glitching'); }, 380);
    setTimeout(glitch, 2600 + Math.random() * 3200);
  }
  setTimeout(glitch, 2000);
})();

// typing tagline cycle
(function () {
  var words = ['engenharia de software', 'web · mobile · api', 'automação de processos', 'do briefing à produção'];
  var el = document.getElementById('tagText');
  var wi = 0, ci = 0, deleting = false;

  function tick() {
    var word = words[wi];
    if (!deleting) {
      ci++;
      el.textContent = '// ' + word.slice(0, ci);
      if (ci === word.length) {
        deleting = true;
        setTimeout(tick, 1600);
        return;
      }
    } else {
      ci--;
      el.textContent = '// ' + word.slice(0, ci);
      if (ci === 0) {
        deleting = false;
        wi = (wi + 1) % words.length;
      }
    }
    setTimeout(tick, deleting ? 28 : 45);
  }
  tick();
})();
</script>

</body>
</html>
